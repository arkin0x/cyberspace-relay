# GRAIN region gate (optional)
#
# Copy to region.yml in the data directory to accept events only from
# pubkeys whose Cyberspace v2 movement chain places them inside a region.
# Reads stay open. Without region.yml (or with enabled: false) there is no
# gate. An invalid region.yml refuses every event until it is fixed.
# See docs/region-gate.md.

enabled: true

# Both modes check every chain rule and every work proof at Level 1 (chain
# rules revision 2026-10-08-residue-openings). They differ only on a proof the
# gate cannot judge: a ride whose as_of or B the Bitcoin line has not reached
# yet, or a hop taller than max_hop_verify_height.
# strict (default): such a proof is not trusted; position = the last event
#   before it. A rider waiting for the line stands where they boarded until
#   the line holds the height; then the chain is checked again at once.
# structural: such a proof is trusted; position = chain head (or the frozen
#   position of an invalid chain). A ride waiting for the line is the
#   exception: it is not trusted in either mode.
mode: strict

# Rides (DECK-0001) are checked against the Bitcoin line built from the block
# anchors (kind 321) this relay holds, signed by line_publisher (default the
# NTH publisher). The line stops at the first height no anchor covers;
# line_fallback fills such a gap (up to 64 blocks between two anchors) from
# block headers fetched by hash and checked against the anchors, so the
# source is trusted for nothing. See "The Bitcoin line" in docs/region-gate.md.
# check_rides: true
# line_publisher: c6e74d44d41fce3b117c1129feacd182918e9fa3b3239579081de9172c4bf5e6
# line_poll_seconds: 30
# line_fallback: false
# line_fallback_urls: [https://mempool.space/api, https://blockstream.info/api]

# The tallest hop (h_max) whose proof is checked; Level 1 costs about 2^h_max
# word additions per sampled residue (about 0.7 s on one core at h24 with
# three tall axes). Default 24, at most 65. The chain cache checks each proof
# once, however often it is sent; HOSAKA sells hops up to h30, and in strict
# mode a hop above the ceiling is not trusted, so its mover stands before it.
# max_hop_verify_height: 24

# Speakeasy (default true): reading also requires NIP-42 AUTH as a pubkey
# inside the region (REQ, COUNT and live events), and every HTTP route except
# the websocket, NIP-11 and NIP-86 is closed (no web client, no dashboard).
# Set auth.relay_url in config.yml to the public URL or no AUTH can succeed.
# false = anyone can read; only writing is gated.
gate_reads: true

# An author is admitted when its position lies in ANY of these.
regions:
  # One sector (2^30 per axis, CYBERSPACE_V2 §10), as in the event S tag.
  - sector: "18014398471862661-18014398502844484-18014398543304959"
    plane: 0 # 0 dataspace, 1 ideaspace
  # An aligned cube of height H (the virtual-bracket region form, §8.11.1):
  # the low H bits of each axis of base must be zero.
  # - base: "<64 hex coordinate>"
  #   height: 40
  # A hint box with per-axis heights (§7.7); 85 leaves an axis open.
  # - base: "<64 hex coordinate>"
  #   heights: [40, 40, 85]

# Where to look up authors' movement events (kind 3333). AUTH challenges are
# answered with GRAIN_REGION_AUTH_KEY (hex or nsec) or a fresh key.
chain_relays:
  - wss://cyberspace.nostr1.com
  - wss://nos.lol
  - wss://relay.damus.io
  - wss://relay.primal.net
use_local_events: true # also use movement events published here

exempt_pubkeys: [] # hex or npub; always admitted (e.g. the operator)
always_allow_kinds: [5] # deletions are always allowed

cache_ttl_seconds: 600 # a cached admission answers this long before newer events are fetched
negative_cache_ttl_seconds: 60 # the same for a refusal
fetch_timeout_seconds: 8
max_concurrent_lookups: 16 # chain checks running at once
max_queued_lookups: 256 # checks waiting; past it, "relay busy, try again"
max_queued_per_ip: 8 # checks waiting from one client address
check_timeout_seconds: 30 # one check's own deadline; a caller waits less and retries
max_cached_chains: 4096 # chain cache entries, least recently used out first
max_chain_events: 5000 # per source per question; a chain over it is refused with "try again"
