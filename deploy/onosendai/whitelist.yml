# ONOSENDAI default relay: who and what may publish (arkinox, 2026-10-11).
# Anyone may publish these kinds; every other kind is refused with
# "not allowed: event kind is not whitelisted". To accept a new kind, add it
# here and to the table in deploy/onosendai/README.md. grain reloads this file
# when it is written in place (README.md, "Changing the config on the droplet").
# Refused on purpose: 1 (never, see the ruling below), 4 (legacy NIP-04 DMs),
# 9735, 30023. 1059 (NIP-17 DMs) is accepted since 2026-11-13, see the ruling
# at its line below. glyphbyte's link-less notes are kind 1, so they
# are refused here too; its cairns (1738) are accepted. 3351 (a Seeds seed)
# is refused: it is an item inside a bag, never published on its own (DECK-0008
# §8.2), like the other bag items (3330, 3340, 3341, 1063).
# config/deploy_onosendai_test.go checks this file.

pubkey_whitelist:
  enabled: false # anyone may publish the kinds below
  pubkeys: []
  npubs: []
  cache_refresh_minutes: 60

kind_whitelist:
  enabled: true
  # RULED (arkinox, 2026-11-05): "ALL cyberspace and onosendai events must be
  # accepted by our relay. Add them. But, we never want to accept bare kind
  # 1s." So every kind a Cyberspace or ONOSENDAI client publishes belongs on
  # this list: when a client starts publishing a new kind, add it here in the
  # same change. Kind 1 is never added; notes ride sealed inside bags only.
  kinds:
    # Cyberspace
    - "3333"   # movement chain (spawn, hops, sidesteps, hyperspace)
    - "33330"  # hidden bags (h tag is a height, never a NIP-29 group)
    - "33331"  # objects (SNO shards)
    - "33335"  # sealed entries: one entry of a hidden bag as its own event (spec §7.6, cyberspace #89)
    - "11333"  # avatars
    - "23330"  # ephemeral chat envelope (not stored); its 23333 line rides inside, never bare
    - "321"    # block anchors (DECK-0001), from the NTH publisher: the hyperspace stops
    - "23334"  # TV watching ping (ephemeral, not stored): without it every set reads 1 WATCHING
    - "33340"  # item listings, the ITEM FEED (DECK-0004 §4)
    - "3367"   # color palettes an SNO object names by nevent (DECK-0003 §1.3b)
    # Seeds (DECK-0008, cyberspace #91); size caps in config.yml
    - "3350"   # DNA: SEEDO text (at most 8,192 bytes), or a mixed DNA (empty content, NIP-13 work)
    - "3352"   # tend: work given to a seed, sealed with the bag's key
    # Cyberspace TV's UPGRADE ANNOUNCEMENT (ONOSENDAI, owner rulings 2026-11-12):
    # one addressable event per version, d = the version (2.1, 2.2, ...),
    # content = the words (at most 900 characters). Anyone may publish the kind;
    # TV plays only those signed by the announcer key it pins
    # (npub1sawgaw2k750pgkpkd2tqderxxtj37h4xvhzlc9vrvzsgjftpvlesmh030p). Size cap in config.yml.
    - "33338"  # TV upgrade announcements
    # glyphbyte (owner, 2026-11-08: "make sure the onosendai relay accepts glyphbyte event kinds")
    - "1738"   # cairns: one URL, found by event-id prefix (glyphbyte spec/CAIRN.md)
    - "35129"  # the glyphbyte napplet (its HTML lives on Blossom; the event points to it)
    # Nostr plumbing ONOSENDAI publishes
    - "0"      # profiles (agents carry bot + operator here)
    - "5"      # deletions (NIP-09): retract objects, derezz, cleanup
    - "7"      # reactions
    - "1111"   # comments (NIP-22) on hops, objects, bags
    - "10002"  # relay lists (NIP-65)
    - "10050"  # DM inbox relay lists (NIP-17): agents copy their operator's
    # DMs (owner, 2026-11-13: "let's make relay.onosendai accept dms and ill
    # use that"): this relay is a NIP-17 DM inbox for the owner and his agents.
    # NIP-17 DMs travel as gift wraps, so only 1059 is accepted; the sealed
    # 13 and the 14/15 rumors inside it are never published bare and stay
    # refused, and so do legacy NIP-04 DMs (4). Reading a gift wrap needs
    # NIP-42 AUTH as the pubkey it p-tags: anyone else can neither read nor
    # count it (server/handlers/dmPrivacy.go). Size cap in config.yml.
    - "1059"   # gift wraps (NIP-59), the envelope of every NIP-17 DM
    - "10063"  # Blossom server lists
    - "10000"  # mute lists (NIP-51): BLOCK and MUTE THIS ITEM

domain_whitelist:
  enabled: false
  domains: []
  cache_refresh_minutes: 120
